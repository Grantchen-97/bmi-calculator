# BMI 计算器 —— 云端一键打包 Android APK
# 用法：
#   1. 把整个 bmi-calculator 目录推送到 GitHub 仓库
#   2. 进入仓库 Actions -> "Build BMI APK" -> Run workflow
#   3. 构建完成后在 Artifacts 中下载 bmi-apk
#
# 可选：正式签名 release 版
#   在仓库 Settings -> Secrets and variables -> Actions 中添加 4 个 secret：
#     KEYSTORE_BASE64      : 你的 release-key.jks 经 base64 编码后的内容
#     KEY_ALIAS            : key 别名
#     KEY_PASSWORD         : key 密码
#     KEYSTORE_PASSWORD    : keystore 密码
#   配置后重新运行工作流，将自动产出签名版 app-release.apk。
name: Build BMI APK

on:
  workflow_dispatch:
  push:
    branches: [main, main1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: 安装 Capacitor
        run: |
          npm install

      - name: 准备 web 资源目录 (www)
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: 生成 Android 工程并同步
        run: |
          npx cap add android || true
          npx cap sync

      - name: 配置签名（如已设置 Secrets）并构建 APK
        run: |
          cd android
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
            python3 - <<'PY'
          import re
          p = "app/build.gradle"
          s = open(p).read()
          if "signingConfigs" not in s:
              s = re.sub(r'(\s*)buildTypes\s*\{',
                         r'\1signingConfigs {\n\1    release {\n\1        storeFile file("release-key.jks")\n\1        storePassword System.getenv("KEYSTORE_PASSWORD")\n\1        keyAlias System.getenv("KEY_ALIAS")\n\1        keyPassword System.getenv("KEY_PASSWORD")\n\1    }\n\1}\n\1buildTypes {',
                         s, count=1)
          s = re.sub(r'(release\s*\{)',
                     r'\1\n            signingConfig signingConfigs.release', s, count=1)
          open(p, "w").write(s)
          print("signing config injected")
          PY
            ./gradlew assembleRelease
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bmi-apk
          path: android/${{ env.APK }}
