# BMI 计算器 —— 云端一键打包 Android APK
# 用法：
#   1. 把整个 bmi-calculator 目录推送到 GitHub 仓库
#   2. 进入仓库 Actions -> "Build BMI APK" -> Run workflow
#   3. 构建完成后在 Artifacts 中下载 bmi-apk (app-debug.apk)
name: Build BMI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: 安装 Capacitor
        run: |
          npm install

      - name: 生成 Android 工程并打包
        run: |
          npx cap add android || true
          npx cap sync
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bmi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
